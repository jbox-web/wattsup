[workspace]
resolver = "2"
members = ["crates/wattsup-core", "crates/test-support", "crates/cli", "crates/wattsup-ffi"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
wattsup-core = { path = "crates/wattsup-core" }
test-support = { path = "crates/test-support" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "7"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
security-framework = "3"
